# Puente · avisos semanales de dependencias y acciones obsoletas.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "configuración"
    # Los saltos de versión mayor se revisan a mano: pueden romper las
    # dependencias entre Vite, Vitest y el plugin de React.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "configuración"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
